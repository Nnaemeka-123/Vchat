create or replace function public.keep_views() returns trigger language plpgsql as $$
declare ov int; nv int;
begin
 if new.kind='post' then
  nv:=coalesce((new.data->>'views')::int,0);
  if tg_op='UPDATE' then ov:=coalesce((old.data->>'views')::int,0); nv:=greatest(ov,nv); end if;
  new.data:=jsonb_set(new.data,'{views}',to_jsonb(nv));
 end if;
 return new;
end $$;
drop trigger if exists records_keepviews on public.records;
create trigger records_keepviews before insert or update on public.records for each row execute function public.keep_views();
create or replace function public.inc_views(p_id text, p_n int) returns void language plpgsql security definer as $$
begin
 if p_n>0 then update public.records set data=jsonb_set(data,'{views}',to_jsonb(coalesce((data->>'views')::int,0)+p_n)) where id='post:'||p_id and kind='post'; end if;
end $$;

async function initCalls(){const u=me();if(!u||(CALL.uid===u.id&&CALL.peer&&!CALL.peer.destroyed))return;if(CALL.peer){try{CALL.peer.destroy()}catch(e){}CALL.peer=null}CALL.uid=u.id;
 try{await loadPeer()}catch(e){return}
 const p=new Peer('vxc'+u.id);CALL.peer=p;
 p.on('call',call=>{if(CALL.call){try{call.close()}catch(e){}return}ring(call,call.metadata||{})});
 p.on('error',e=>{if(e.type==='peer-unavailable'&&CALL.call&&CALL.call._out){toast('That person is offline or not in the app right now');endCall()}});
 p.on('disconnected',()=>{try{p.reconnect()}catch(e){}})}
function ring(call,meta){CALL.call=call;try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300])}catch(e){}
 const s=sheet(`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px;text-align:center">${av(U(meta.uid)||{name:meta.name||'?',id:meta.uid},96)}<div style="font-size:24px;font-weight:800">${esc(meta.name||'Someone')}</div><div class="mu">Incoming video call…</div><div class="row" style="gap:30px;margin-top:30px"><button class="btn red" style="padding:14px 26px" id="cdec">Decline</button><button class="btn blue" style="padding:14px 26px;background:#00ba7c" id="cacc">Accept</button></div></div>`);

const LOGOIMG=new Image();LOGOIMG.src=LOGO;
function wm(x,W,H,un){const fs=Math.max(16,Math.round(W*.035)),pad=Math.round(fs*.8),txt='VELTEX  @'+un;x.save();x.font='700 '+fs+'px sans-serif';const tw=x.measureText(txt).width,bh=Math.round(fs*2),bw=Math.round(tw+bh+pad),bx=W-bw-pad,by=H-bh-pad;
 x.fillStyle='rgba(0,0,0,.5)';x.beginPath();if(x.roundRect)x.roundRect(bx,by,bw,bh,bh/2);else x.rect(bx,by,bw,bh);x.fill();
 if(LOGOIMG.complete&&LOGOIMG.naturalWidth){x.save();x.beginPath();x.arc(bx+bh/2,by+bh/2,bh/2-3,0,Math.PI*2);x.clip();x.drawImage(LOGOIMG,bx+3,by+3,bh-6,bh-6);x.restore()}
 x.fillStyle='#fff';x.textBaseline='middle';x.fillText(txt,bx+bh+2,by+bh/2+1);x.restore()}
function saveBlob(b,name){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
A.dl=async id=>{const p=P_(id);if(!p||!p.mid)return;const un=(U(p.uid)||{}).username||'veltex';const url=await mediaUrl(p.mid);if(!url)return toast('Media not available');
 if(p.mt==='image'){try{const img=new Image();img.crossOrigin='anonymous';await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=url});const k=Math.min(1,2400/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);wm(x,c.width,c.height,un);c.toBlob(b=>{saveBlob(b,'veltex-'+p.id+'.jpg');toast('Downloaded with VELTEX watermark')},'image/jpeg',.92)}catch(e){toast('Could not download this image')}return}
 const v=document.createElement('video');if(!(v.captureStream||v.mozCaptureStream)||!window.MediaRecorder)return toast('Video download with watermark needs Chrome on Android or desktop');
 const sk=sndInfo(p.snd);let au=null;

 let stop=false;prog._cl=()=>{stop=true;try{v.pause();au&&au.pause()}catch(e){}};$('#dlx',prog).onclick=()=>prog.cl();
 try{v.crossOrigin='anonymous';v.playsInline=true;v.src=url;v.muted=!!sk;await new Promise((r,j)=>{v.onloadedmetadata=r;v.onerror=j});
  const W=v.videoWidth,H=v.videoHeight,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),cs=c.captureStream(30);
  if(sk){const su=await mediaUrl(sk.mid);au=new Audio();au.crossOrigin='anonymous';au.src=su;au.loop=true}
  v.currentTime=0;await v.play();if(au){try{await au.play()}catch(e){}}
  const src=sk&&au?au:v;const as=(src.captureStream||src.mozCaptureStream).call(src).getAudioTracks();as.forEach(tk=>cs.addTrack(tk));
  const types=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'],mime=types.find(m=>MediaRecorder.isTypeSupported(m))||'';
  const rec=new MediaRecorder(cs,mime?{mimeType:mime,videoBitsPerSecond:4e6}:{}),chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  const done=new Promise(r=>rec.onstop=r);rec.start(500);
  const draw=()=>{if(stop||v.ended)return;x.drawImage(v,0,0,W,H);wm(x,W,H,un);const b=$('#dlp');if(b&&v.duration)b.style.width=Math.min(100,v.currentTime/v.duration*100)+'%';requestAnimationFrame(draw)};draw();
  await new Promise(r=>{v.onended=r;const iv=setInterval(()=>{if(stop){clearInterval(iv);r()}},300);v.addEventListener('ended',()=>clearInterval(iv))});
  rec.stop();await done;if(au)au.pause();if(stop)return;prog.cl();

const findU=x=>S.users.find(u=>u.username===String(x||'').replace(/^@/,'').toLowerCase());
function botMsg(id,to,text){if(S.msgs.some(m=>m.id===id))return;const ts=Date.now();S.msgs.push({id,from:A_ID,to,text,ts,read:false,off:true});S.notifs.unshift({id:'n'+id,to,type:'official',from:A_ID,pid:null,txt:text,ts,read:false})}
const BOT_CMDS=['help','stats','activate','ban','unban','verify','unverify','message','broadcast'];
function botExec(raw,tid){const s=String(raw).trim(),m=s.match(/^(\w+)\s*([\s\S]*)$/),c=(m?m[1]:'').toLowerCase(),rest=m?m[2].trim():'',bid=k=>tid?'bt'+tid+'_'+k:'bm'+uid();
 const tok=rest.split(/\s+/),u=findU(tok[0]);
 switch(c){
 case 'help':return 'I can do these:\n• stats\n• activate (start all waiting boosts)\n• ban @user\n• unban @user\n• verify @user blue|silver|gold\n• unverify @user\n• message @user your text\n• broadcast your text\n\nSchedule any of them:\n• in 30m broadcast Hello\n• in 2h ban @user\n• at 18:30 broadcast Good evening';
 case 'stats':{const n=Date.now(),d=864e5;return `${S.users.length} users (${S.users.filter(x=>n-x.ts<d).length} new today)\n${S.posts.length} posts (${S.posts.filter(x=>n-x.ts<d).length} today)\n${S.msgs.length} messages\n${S.orders.filter(o=>o.status==='pending').length} badge payments waiting\n${S.payouts.filter(p=>p.status==='pending').length} payout requests\n${S.users.filter(x=>x.banned).length} banned accounts`}
 case 'activate':{const q=S.boosts.filter(x=>x.status==='queued');q.forEach(activateBoost);return `Activated ${q.length} boost${q.length===1?'':'s'}.`}
 case 'ban':case 'unban':{if(!u)return 'I could not find that user. Use ban @username';if(u.isAdmin)return 'I cannot do that to the owner account.';u.banned=c==='ban';act('bot',`Bot ${c}ned @${u.username}`);return `Done. @${u.username} is now ${u.banned?'banned':'unbanned'}.`}
 case 'verify':{const b=(tok[1]||'').toLowerCase();if(!u||!['blue','silver','gold'].includes(b))return 'Use: verify @username blue|silver|gold';u.badge=b;botMsg(bid(u.id),u.id,`Congratulations! Your VELTEX account is now verified with the ${b==='gold'?'Premium+ Gold':b[0].toUpperCase()+b.slice(1)} badge. This is an official message from VELTEX.`);act('bot',`Bot gave ${b} badge to @${u.username}`);return `Done. @${u.username} now has the ${b} badge.`}
 case 'unverify':{if(!u)return 'Use: unverify @username';u.badge='none';botMsg(bid(u.id),u.id,'Your verification badge has been removed.');return `Done. Badge removed from @${u.username}.`}
 case 'message':{const text=rest.slice(tok[0].length).trim();if(!u||!text)return 'Use: message @username your text';botMsg(bid(u.id),u.id,text);return `Sent to @${u.username}.`}
 case 'broadcast':{if(!rest)return 'Use: broadcast your text';const us=S.users.filter(x=>!x.isAdmin&&!x.banned);us.forEach(x=>botMsg(bid(x.id),x.id,rest));act('bot','Bot broadcast: '+rest.slice(0,60));return `Sent to ${us.length} users.`}
 default:return 'I do not know that command. Type help.'}}
function botTick(){const b=S.settings.bot;if(!b||!b.on)return;const now=Date.now();
 if(isAdmin()){if(b.remind!==false){S.orders.filter(o=>o.status==='pending'&&now-o.ts>216e5).forEach(o=>{const id='rm_'+o.id;if(!S.notifs.some(n=>n.id===id))S.notifs.unshift({id,to:A_ID,type:'official',from:null,pid:null,txt:`Reminder: a ${o.type==='topup'?'wallet top-up':'badge'} payment of ${naira(o.amount)} has been waiting for over 6 hours.`,ts:now,read:false})})}

 if(b.reply||b.kw){S.msgs.forEach(m=>{if(m.to!==A_ID||m.from===A_ID||now-m.ts>2*864e5)return;const id='br_'+m.from+'_'+Math.floor(m.ts/216e5);if(S.msgs.some(x=>x.id===id))return;
  const txt=String(m.text).toLowerCase();let rep='';(b.kw||'').split('\n').forEach(line=>{const i=line.indexOf('=');if(i>0&&!rep){const k=line.slice(0,i).trim().toLowerCase();if(k&&txt.includes(k))rep=line.slice(i+1).trim()}});if(!rep)rep=b.reply;if(!rep)return;

 const c=vs.filter(v=>g==='f'?F.test(v.name):(M.test(v.name)&&!F.test(v.name)));return c[0]||vs.find(v=>g==='f'?F.test(v.name):!F.test(v.name))||vs[0]}

 if(k==='scores'){S.scores=maxScores(S.scores,d);snap[key]=rj;return true}
 if(!col)return false;
 const i=S[col].findIndex(x=>k+':'+x.id===key),loc=i>=0?S[col][i]:null;let nv=d;
 if(loc&&known&&canon(sd(k,loc))!==snap[key]){nv=mergeRec(loc,d,JSON.parse(snapRaw[key]||'{}'));pushNeeded=true;if(k==='post'&&vmode==='rpc')nv.views=d.views}
 if(i>=0)S[col][i]=nv;else S[col].push(nv);
 snap[key]=rj;snapRaw[key]=JSON.stringify(d);return true}
async function api(path,opt={}){const h={apikey:cloud.key,...(/^eyJ/.test(cloud.key)?{Authorization:'Bearer '+cloud.key}:{}),...(opt.headers||{})};const r=await fetch(cloud.url+path,{...opt,headers:h});if(!r.ok){let t='';try{t=await r.text()}catch(e){}throw new Error(r.status+' '+t.slice(0,200))}return r}
function groups(){const u=me();const g=[{k:'pub',q:'kind=in.(user,post,settings,scores,listing,sound,task,gift,boost,spad)'}];
 if(S.settings.bot&&S.settings.bot.on)g.push({k:'off',q:'kind=in.(msg)&ub=eq.u_veltex'});
 if(u){g.push({k:'me:'+u.id,q:'kind=in.(msg,notif,payout,order)&or=(ua.eq.'+u.id+',ub.eq.'+u.id+')'});if(u.isAdmin)g.push({k:'adm',q:'kind=in.(msg,payout,order,log)'})}
 return g}
async function pullGroup(g){let last=smeta.last[g.k]||'1970-01-01T00:00:00+00:00',ch=0;
 for(let pg=0;pg<60;pg++){const r=await api('/rest/v1/records?select=*&'+g.q+'&updated_at=gte.'+encodeURIComponent(last)+'&order=updated_at.asc,id.asc&limit=1000');const rows=await r.json();
  rows.forEach(x=>{if(applyRemote(x))ch++});if(rows.length)last=rows[rows.length-1].updated_at;if(rows.length<1000)break}
 smeta.last[g.k]=last;return ch}
const upFail=new Set();
async function uploadMedia(mid){const b=await kvGet('m:'+mid);if(!b){smeta.upl[mid]=1;return true}
 try{await api('/storage/v1/object/media/'+encodeURIComponent(mid),{method:'POST',headers:{'Content-Type':b.type||'application/octet-stream','x-upsert':'true'},body:b});smeta.upl[mid]=1;return true}
 catch(e){if(!upFail.has(mid)){upFail.add(mid);toast('Upload failed: '+String(e.message).slice(0,90)+'. Free Supabase plans allow 50 MB per file.')}throw e}}
async function push(){const cur=curRecs(),up=[];
 for(const[key,r]of Object.entries(cur)){const j=canon(sd(r.kind,r.data));if(snap[key]!==j)up.push([key,r,j])}
 const dels=Object.keys(snap).filter(k=>!(k in cur)&&k!=='settings:settings'&&k!=='scores:scores');
 const ok=[];
 for(const x of up){const r=x[1];let bad=false;for(const mid of (r.kind==='post'||r.kind==='sound'||r.kind==='spad'?[r.data.mid]:r.kind==='listing'?(r.data.mids||[]):[])){if(mid&&!smeta.upl[mid]){try{await uploadMedia(mid)}catch(e){bad=true;break}}}if(bad)continue;ok.push(x)}
 for(let i=0;i<ok.length;i+=100){const ch=ok.slice(i,i+100);
  await api('/rest/v1/records?on_conflict=id',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(ch.map(([k,r])=>({id:r.id,kind:r.kind,ua:r.ua,ub:r.ub,data:sd(r.kind,r.data)})))});
  ch.forEach(([k,r,j])=>{snap[k]=j;snapRaw[k]=JSON.stringify(r.data)})}
 for(const key of dels){await api('/rest/v1/records?id=eq.'+encodeURIComponent(key),{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({data:{_del:true}})});delete snap[key];delete snapRaw[key]}}
let syncP=null,syncAgain=false,syncT;
let syncWarned=false;
async function _sync(){let ch=0;
 try{await probeViews();for(const g of groups())ch+=await pullGroup(g);if(ch)normalizeS();if(typeof botTick==='function')botTick();if(typeof boostTick==='function')boostTick();if(typeof giftBotTick==='function')giftBotTick();await flushViews();if(pushNeeded||Date.now()-lastPush>30000){pushNeeded=false;lastPush=Date.now();await push()}syncStat={ok:true,err:'',at:Date.now()};syncWarned=false}
 catch(e){pushNeeded=true;syncStat={ok:false,err:String(e&&e.message||e),at:Date.now()};if(!syncWarned&&me()&&!me().isAdmin){syncWarned=true;toast("Can't reach VELTEX servers. Check your internet.")}}
 await persist();if(ch){try{afterPull()}catch(e){console.error(e)}}}
function syncOnce(){if(!cloud)return Promise.resolve();if(syncP)return syncP;syncP=_sync().finally(()=>{syncP=null;if(syncAgain){syncAgain=false;syncSoon()}});return syncP}
function syncSoon(){if(!cloud)return;pushNeeded=true;clearTimeout(syncT);syncT=setTimeout(()=>{if(syncP)syncAgain=true;else syncOnce()},400)}
/*SYNC_END*/
let lastN=0,lastM=0;
function setupSync(){if(cloud)return;try{bc=new BroadcastChannel('veltex')}catch(e){return}
 bc.onmessage=async()=>{const raw=await kvGet('db');if(!raw)return;delete raw._sync;S=raw;afterPull()}}

function afterPull(){const u=me();if(!u)return;
 if(u.banned){toast('Your account was banned');sess.list=sess.list.filter(x=>x!==u.id);sess.cur=sess.list[0]||null;saveSess();if(sess.cur){stack=[];view={n:'home'};showApp()}else{$$('.sheet').forEach(s=>s.cl());authScreen()}return}
 const n=unreadN(),m=unreadMsgs();if(n>lastN||m>lastM){let msg=m>lastM?'New message':'New notification';if(m>lastM){const lm=S.msgs.filter(x=>x.to===sess.cur&&!x.read).sort((a,b)=>b.ts-a.ts)[0];if(lm)msg=((U(lm.from)||{}).name||'VELTEX')+': '+String(lm.text).slice(0,80)}else{const ln=S.notifs.find(x=>x.to===sess.cur&&!x.read);if(ln)msg=notifLine(ln)}toast(msg);try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}sysNotify(msg)}lastN=n;lastM=m;
 refreshChrome();
 if(view.n==='home'&&view.f==='mk'){if(!$('.sheet')&&!(document.activeElement&&document.activeElement.matches('input,textarea'))){const y=$('#main').scrollTop;render();$('#main').scrollTop=y}}
 else if(view.n==='home'){$$('.card[data-pid]').forEach(c=>{if(P_(c.dataset.pid))refreshRail(c.dataset.pid)});refreshAuthors();const f=$('#feed');if(f&&!$('.pill')){const shown=new Set($$('.card[data-pid]',f).map(c=>c.dataset.pid));if(S.posts.some(p=>!shown.has(p.id)&&U(p.uid)&&!U(p.uid).banned&&(view.f!=='sub'||p.uid===sess.cur||U(p.uid).subs.includes(sess.cur))))$('#main').insertAdjacentHTML('beforeend','<button class="pill" data-a="refreshfeed">↑ New posts</button>')}}
 else if(view.n==='chat'){const i=$('#min'),v=i?i.value:'',f=i&&document.activeElement===i;render();const j=$('#min');if(j){j.value=v;if(f)j.focus()}}
 else if(!$('.sheet')&&!(document.activeElement&&document.activeElement.matches('input,textarea'))){const y=$('#main').scrollTop;render();$('#main').scrollTop=y}}
A.refreshfeed=()=>render();

 try{await idbOpen();await load()}catch(e){document.body.innerHTML='<p style="padding:30px">Your browser blocked storage. Turn off private mode and reload.</p>';return}

 await new Promise(r=>setTimeout(r,Math.max(0,1900-(Date.now()-T0))));$('#splash').remove();
 if(me()){lastN=unreadN();lastM=unreadMsgs();showApp()}else{$('#app').hidden=false;authScreen()}

 if(cloud){setInterval(()=>{if(!document.hidden)syncOnce()},4000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncOnce()})}
})().catch(e=>{console.error(e);try{document.getElementById('splash').innerHTML='<div style="padding:30px;text-align:center;color:#e7e9ea"><h2>VELTEX could not start</h2><p style="color:#71767b;margin:12px 0">'+String(e&&e.message||e)+'</p><button onclick="location.href=location.pathname+\'?r=\'+Date.now()" style="background:#1d9bf0;color:#fff;border:0;border-radius:99px;padding:12px 26px;font-size:16px">Reload</button></div>'}catch(_){}});
